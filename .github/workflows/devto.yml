name: DEV.to Posts

on:
  schedule:
    - cron: "0 * * * *"   # Atualiza de hora a hora
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://dev.to/feed/fevunge"
